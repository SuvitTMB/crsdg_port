<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="76" height="76" rx="16" fill="#0D1B2A" stroke="url(#cyanGrad)" stroke-width="2"/>
  <text x="40" y="44" font-family="'Kanit', sans-serif" font-weight="900" font-size="24" fill="#00E5FF" text-anchor="middle" dominant-baseline="middle">CRS</text>
  <text x="40" y="62" font-family="'Kanit', sans-serif" font-weight="700" font-size="12" fill="#FFA726" text-anchor="middle">DG</text>
  <text x="96" y="38" font-family="'Kanit', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="2">NEW YEAR 2026</text>
  <text x="96" y="60" font-family="'Prompt', sans-serif" font-weight="500" font-size="12" fill="url(#goldGrad)" letter-spacing="4">LUCKY DRAW GAME SHOW</text>
</svg>